<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portál Technické Podpory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #9CA3AF;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl w-full space-y-8">
        <div class="text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl">
                Technická Podpora
            </h1>
            <p class="mt-3 text-xl text-gray-400">
                Jsme tu pro vás. Napište nám svůj problém a my vám obratem pomůžeme.
            </p>
        </div>

        <div class="bg-gray-800 shadow-xl rounded-2xl p-6 sm:p-10 border border-gray-700">
            <form id="support-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">Vaše e-mailová adresa</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="appearance-none block w-full px-4 py-3 border border-gray-600 rounded-lg shadow-sm bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out"
                            placeholder="jan.novak@example.com">
                    </div>
                </div>

                <div>
                    <label for="query" class="block text-sm font-medium text-gray-300">Popis problému</label>
                    <div class="mt-1">
                        <textarea id="query" name="query" rows="4" required
                            class="appearance-none block w-full px-4 py-3 border border-gray-600 rounded-lg shadow-sm bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out"
                            placeholder="Zde podrobně popište, s čím potřebujete pomoci..."></textarea>
                    </div>
                </div>

                <div>
                    <button type="submit" id="submit-btn"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-900 transition duration-150 ease-in-out">
                        Odeslat dotaz
                    </button>
                </div>
            </form>
        </div>

        <div id="tickets-container" class="space-y-6 mt-10">
            <!-- Dynamicky přidávané tickety -->
        </div>
    </div>

    <script>
        const form = document.getElementById('support-form');
        const ticketsContainer = document.getElementById('tickets-container');
        const submitBtn = document.getElementById('submit-btn');
        let ticketCounter = 1;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const query = document.getElementById('query').value;
            
            if (!email || !query) return;

            // Zablokování formuláře během odesílání
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Odesílám...';
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Vytvoření bloku pro nový dotaz
            const ticketId = `ticket-${ticketCounter++}`;
            const ticketElement = createTicketElement(ticketId, email, query);
            ticketsContainer.insertBefore(ticketElement, ticketsContainer.firstChild);

            // Vyčištění formuláře
            document.getElementById('query').value = '';

            // Volání Gemini API pro generování odpovědi
            await fetchSupportResponse(ticketId, query);

            // Odblokování formuláře
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Odeslat dotaz';
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        });

        function createTicketElement(id, email, query) {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'bg-gray-800 rounded-2xl overflow-hidden shadow-lg border border-gray-700 fade-in';
            
            const date = new Date().toLocaleString('cs-CZ');
            
            div.innerHTML = `
                <div class="p-6 border-b border-gray-700 bg-gray-800/50">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <div class="bg-blue-900/50 text-blue-400 p-2 rounded-full">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-200">${email}</p>
                                <p class="text-xs text-gray-500">${date}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-900/50 text-yellow-400 border border-yellow-700/50">
                            Zpracovává se
                        </span>
                    </div>
                    <p class="mt-4 text-gray-300 whitespace-pre-wrap">${escapeHTML(query)}</p>
                </div>
                <div class="response-container p-6 bg-gray-750 min-h-[100px] flex flex-col justify-center">
                    <div class="typing-indicator flex items-center text-gray-400 text-sm">
                        <span></span><span></span><span></span>
                        <span class="ml-3">Podpora píše odpověď...</span>
                    </div>
                </div>
            `;
            return div;
        }

        async function fetchSupportResponse(ticketId, userQuery) {
            const ticketElement = document.getElementById(ticketId);
            const responseContainer = ticketElement.querySelector('.response-container');
            const statusBadge = ticketElement.querySelector('span.rounded-full');
            
            const systemPrompt = "Jsi profesionální, empatický a velmi užitečný agent technické podpory. Tvé jméno je AI Asistent. Odpovídej vždy v češtině, stručně, jasně a slušně. Snaž se identifikovat problém a navrhnout konkrétní kroky k řešení nebo požádat o doplňující informace, pokud jsou potřeba k vyřešení problému.";
            
            const apiKey = ""; // Canvas doplní klíč automaticky
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('API Request failed');
                
                const result = await response.json();
                const replyText = result.candidates[0].content.parts[0].text;
                
                // Aktualizace UI s odpovědí
                statusBadge.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-900/50 text-green-400 border border-green-700/50";
                statusBadge.textContent = "Vyřešeno";
                
                responseContainer.innerHTML = `
                    <div class="flex items-start space-x-3 fade-in">
                        <div class="bg-green-900/50 text-green-400 p-2 rounded-full mt-1 flex-shrink-0">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-200 mb-1">Technická Podpora (AI)</p>
                            <div class="prose prose-invert prose-sm max-w-none text-gray-300">
                                ${formatResponse(escapeHTML(replyText))}
                            </div>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Error fetching support response:", error);
                statusBadge.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-900/50 text-red-400 border border-red-700/50";
                statusBadge.textContent = "Chyba";
                
                responseContainer.innerHTML = `
                    <div class="flex items-center space-x-2 text-red-400 fade-in">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p class="text-sm">Omlouváme se, systém technické podpory je aktuálně nedostupný. Zkuste to prosím později.</p>
                    </div>
                `;
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        function formatResponse(text) {
            // Jednoduchá náhrada odřádkování pro HTML zobrazení a základní formátování markdownu
            let formatted = text.replace(/\n/g, '<br>');
            // Tučné písmo
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Odkazy
            formatted = formatted.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" class="text-blue-400 hover:underline" target="_blank">$1</a>');
            return formatted;
        }
    </script>
</body>
</html>
