<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portál Technické Podpory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #9CA3AF;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl w-full space-y-8">
        <div class="text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl">
                Technická Podpora
            </h1>
            <p class="mt-3 text-xl text-gray-400">
                Jsme tu pro vás. Napište nám svůj problém a my vám obratem pomůžeme.
            </p>
        </div>

        <div class="bg-gray-800 shadow-xl rounded-2xl p-6 sm:p-10 border border-gray-700">
            <form id="support-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">Vaše e-mailová adresa</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="appearance-none block w-full px-4 py-3 border border-gray-600 rounded-lg shadow-sm bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out"
                            placeholder="jan.novak@example.com">
                    </div>
                </div>

                <div>
                    <label for="query" class="block text-sm font-medium text-gray-300">Popis problému</label>
                    <div class="mt-1">
                        <textarea id="query" name="query" rows="4" required
                            class="appearance-none block w-full px-4 py-3 border border-gray-600 rounded-lg shadow-sm bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out"
                            placeholder="Zde podrobně popište, s čím potřebujete pomoci..."></textarea>
                    </div>
                </div>

                <div>
                    <button type="submit" id="submit-btn"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-900 transition duration-150 ease-in-out">
                        Odeslat dotaz
                    </button>
                </div>
            </form>
        </div>

        <div id="tickets-container" class="space-y-6 mt-10">
            <!-- Dynamicky přidávané tickety -->
        </div>
    </div>

<script>
        const form = document.getElementById('support-form');
        const ticketsContainer = document.getElementById('tickets-container');
        const submitBtn = document.getElementById('submit-btn');
        const queryInput = document.getElementById('query');
        
        let ticketCounter = 1;

        // Formátování data
        const formatDate = () => {
            const now = new Date();
            return now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }) + ' - ' + now.toLocaleDateString('cs-CZ');
        };

        // Zamezení nebezpečným HTML znakům
        const escapeHTML = (str) => {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        };

        // Formátování textu odpovědi z markdownu do HTML
        const formatResponse = (text) => {
            let formatted = escapeHTML(text);
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>'); // Tučné
            formatted = formatted.replace(/\*(.*?)\*/g, '<em class="text-gray-300">$1</em>'); // Kurzíva
            formatted = formatted.replace(/`(.*?)`/g, '<code class="bg-gray-800 text-blue-300 px-1.5 py-0.5 rounded text-sm font-mono">$1</code>'); // Kód
            formatted = formatted.replace(/\n/g, '<br>'); // Odřádkování
            return formatted;
        };

        // Vytvoření vizuálního bloku (ticketu) pro dotaz a odpověď
        const createTicketElement = (id, email, query) => {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'bg-gray-800/80 rounded-2xl overflow-hidden shadow-lg border border-gray-700/50 backdrop-blur-sm fade-in flex flex-col';
            
            div.innerHTML = `
                <!-- Uživatelský dotaz -->
                <div class="p-6 border-b border-gray-700/50 bg-gray-800/40">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-gray-400 border border-gray-600">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-gray-200">${escapeHTML(email)}</p>
                                <p class="text-xs text-gray-500">${formatDate()}</p>
                            </div>
                        </div>
                        <span class="status-badge inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
                            <i class="fas fa-circle-notch fa-spin mr-1.5"></i> Zpracovává se
                        </span>
                    </div>
                    <p class="text-gray-300 whitespace-pre-wrap leading-relaxed">${escapeHTML(query)}</p>
                </div>

                <!-- Odpověď podpory (nejprve indikátor načítání) -->
                <div class="response-container p-6 bg-gray-800/80 min-h-[120px] flex flex-col">
                    <div class="flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-900/50 flex-shrink-0">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="flex-1 pt-2">
                            <div class="typing-indicator flex items-center text-gray-400 text-sm h-6">
                                <span></span><span></span><span></span>
                                <span class="ml-3 font-medium tracking-wide">AI Podpora analyzuje dotaz...</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            return div;
        };

        // Funkce pro zavolání Gemini API a zobrazení výsledku
        async function fetchSupportResponse(ticketId, userQuery) {
            const ticketElement = document.getElementById(ticketId);
            const responseContainer = ticketElement.querySelector('.response-container');
            const statusBadge = ticketElement.querySelector('.status-badge');
            
            // Instrukce pro model - určuje chování agenta
            const systemPrompt = `Jsi profesionální, velmi empatický a užitečný AI agent technické podpory. 
            Tvé jméno je "Podpora AI". 
            Pravidla pro odpověď:
            1. Odpovídej vždy v češtině.
            2. Buď stručný, jasný a velmi slušný.
            3. Snaž se pochopit problém uživatele.
            4. Navrhni konkrétní kroky k řešení ve formě odrážek (použij pomlčky).
            5. Pokud nemáš dostatek informací, popros o jejich doplnění.
            6. Na konci odpovědi popřej hezký den nebo nabídni další pomoc.`;
            
            const apiKey = ""; // API klíč je automaticky injektován Canvas prostředím
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`Chyba API: ${response.status}`);
                }
                
                const result = await response.json();
                
                // Extrakce textu z odpovědi
                let replyText = "";
                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts.length > 0) {
                    replyText = result.candidates[0].content.parts[0].text;
                } else {
                    throw new Error("Neplatná struktura odpovědi z API");
                }
                
                // Úspěch - aktualizace UI
                statusBadge.className = "status-badge inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20";
                statusBadge.innerHTML = '<i class="fas fa-check mr-1.5"></i> Vyřešeno';
                
                responseContainer.innerHTML = `
                    <div class="flex items-start space-x-4 fade-in">
                        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-900/50 flex-shrink-0 relative">
                            <i class="fas fa-robot"></i>
                            <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-green-500 border-2 border-gray-800 rounded-full"></div>
                        </div>
                        <div class="flex-1 bg-gray-700/30 rounded-2xl rounded-tl-none p-4 border border-gray-600/30">
                            <p class="text-sm font-semibold text-blue-300 mb-2">Podpora AI <span class="text-xs text-gray-500 ml-2 font-normal">${formatDate()}</span></p>
                            <div class="text-gray-200 text-sm leading-relaxed space-y-3">
                                ${formatResponse(replyText)}
                            </div>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Error fetching support response:", error);
                
                // Chyba - aktualizace UI
                statusBadge.className = "status-badge inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                statusBadge.innerHTML = '<i class="fas fa-exclamation-circle mr-1.5"></i> Chyba';
                
                responseContainer.innerHTML = `
                    <div class="flex items-start space-x-4 fade-in">
                        <div class="w-10 h-10 rounded-full bg-red-900/50 border border-red-500/30 flex items-center justify-center text-red-400 flex-shrink-0">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="flex-1 bg-red-900/10 rounded-2xl rounded-tl-none p-4 border border-red-900/30">
                            <div class="flex items-center text-red-400 space-x-2">
                                <i class="fas fa-exclamation-triangle"></i>
                                <p class="text-sm font-medium">Omlouváme se, systém AI podpory je aktuálně nedostupný. Zkuste to prosím znovu za malou chvíli.</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Event listener pro formulář
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const query = queryInput.value.trim();
            
            if (!email || !query) return;

            // 1. Změna stavu tlačítka (zablokování)
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i><span>Zpracovávám dotaz...</span>';
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            // 2. Vytvoření ticketu v historii
            const ticketId = `ticket-${ticketCounter++}`;
            const ticketElement = createTicketElement(ticketId, email, query);
            
            // Přidání na začátek (nejnovější nahoře)
            ticketsContainer.insertBefore(ticketElement, ticketsContainer.firstChild);

            // 3. Vyčištění pole pro dotaz (aby mohl psát další)
            queryInput.value = '';

            // 4. Zavolání API (běží na pozadí)
            await fetchSupportResponse(ticketId, query);

            // 5. Obnovení tlačítka
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Odeslat další dotaz</span>';
            submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        });

    </script>
</body>
</html>
